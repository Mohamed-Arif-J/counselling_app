{% load static %}
<div class="chat-launcher-wrapper" id="launcherWrapper">
    <div class="chat-hover-banner">
        <h5>Meet our Mindcare Assistant!</h5>
        <p>Ask for Help and clear your doubts here.</p>
    </div>
    
    <button class="chat-trigger-btn" id="chatTrigger" onclick="toggleChatWindow()">
        <div class="robot-icon-container" id="iconWrapper">
            <i class="fa-solid fa-robot" id="chatIcon"></i>
        </div>
    </button>
</div>

<div class="chat-window-box" id="chatWindow">
    <div class="chat-header-bar">
        <div class="chat-bot-profile">
            <div class="chat-bot-avatar">
                <i class="fa-solid fa-robot"></i>
            </div>
            <div class="chat-bot-info">
                <h4>MindCare Assistant</h4>
                <div class="chat-bot-status">
                    <i class="fa-solid fa-circle" style="font-size: 6px;"></i> Online
                </div>
            </div>
        </div>
        <button class="close-chat-btn" onclick="toggleChatWindow()">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="chat-body-stream" id="chatBodyStream">
        <div class="chat-bubble bubble-bot">
            Hello there! 👋 I am your private assistant. How can I support your well-being journey today?
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" class="chat-input-box" id="chatInput" placeholder="Write message here..." onkeypress="handleChatEnter(event)">
        <button class="chat-send-btn" onclick="processUserMessage()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    function toggleChatWindow() {
        const chatWindow = document.getElementById('chatWindow');
        const chatIcon = document.getElementById('chatIcon');
        const launcherWrapper = document.getElementById('launcherWrapper');
        
        chatWindow.classList.toggle('active-open');
        launcherWrapper.classList.toggle('chat-is-open');
        
        if (chatWindow.classList.contains('active-open')) {
            chatIcon.className = 'fa-solid fa-chevron-down';
            const style = document.createElement('style');
            style.id = 'hideBadge';
            style.innerHTML = '.robot-icon-container::after { display: none; }';
            document.head.appendChild(style);
        } else {
            chatIcon.className = 'fa-solid fa-robot';
            const styleElement = document.getElementById('hideBadge');
            if(styleElement) styleElement.remove();
        }
    }

    function handleChatEnter(event) {
        if (event.key === 'Enter') {
            processUserMessage();
        }
    }

    /* ========================================================================================
       PRODUCTION NETWORK PIPELINE CONNECTING FRONTEND UTILITIES DIRECT TO AI VIEWS
       ======================================================================================== */
    function processUserMessage() {
        const inputField = document.getElementById('chatInput');
        const textMessage = inputField.value.trim();
        if (textMessage === "") return;

        const chatStream = document.getElementById('chatBodyStream');

        // Append User Message Bubble
        const userBubble = document.createElement('div');
        userBubble.className = 'chat-bubble bubble-user';
        userBubble.textContent = textMessage;
        chatStream.appendChild(userBubble);

        inputField.value = "";
        chatStream.scrollTop = chatStream.scrollHeight;

        // Append Typing/Thinking Animation Indicator Placeholder
        const typingIndicator = document.createElement('div');
        typingIndicator.className = 'chat-bubble bubble-bot typing-placeholder';
        typingIndicator.innerHTML = '<i class="fa-solid fa-ellipsis fa-bounce"></i> MindCare is typing...';
        chatStream.appendChild(typingIndicator);
        chatStream.scrollTop = chatStream.scrollHeight;

        // AJAX Fetch request sending data direct to Django API view layer 
        fetch('/mood_tracker/chatbot/', {  // <-- Change this path URL if your routing differs
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookieCSRFToken('csrftoken') // Secures requests against cross-origin middleware validation errors
            },
            body: JSON.stringify({ 'message': textMessage })
        })
        .then(response => {
            if (!response.ok) throw new Error('Network server environment exception occurred.');
            return response.json();
        })
        .then(data => {
            // Remove the thinking animation dot block
            typingIndicator.remove();

            const botResponseBubble = document.createElement('div');
            botResponseBubble.className = 'chat-bubble bubble-bot';
            botResponseBubble.textContent = data.reply || "I am processing your context data. Please try again shortly.";
            chatStream.appendChild(botResponseBubble);
            chatStream.scrollTop = chatStream.scrollHeight;
        })
        .catch(error => {
            console.error('Chatbot error:', error);
            typingIndicator.remove();
            
            const errorBubble = document.createElement('div');
            errorBubble.className = 'chat-bubble bubble-bot';
            errorBubble.style.color = '#e63946';
            errorBubble.textContent = "Connecting to pipeline logs timed out. Please try sending your message again.";
            chatStream.appendChild(errorBubble);
            chatStream.scrollTop = chatStream.scrollHeight;
        });
    }

    // Helper utility function to parse out your Django active browser cookies
    function getCookieCSRFToken(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
